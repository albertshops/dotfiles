onboarding = false

[terminal]
new_cwd = "follow"

[keys]
detach = "prefix+d"
workspace_picker = ""
new_workspace = "prefix+w"
new_tab = "prefix+t"
previous_workspace = "ctrl+k"
next_workspace = "ctrl+j"
focus_pane_down = ""
focus_pane_up = ""
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"
next_tab = "ctrl+l"
previous_tab = "ctrl+h"
switch_tab = ""
copy_mode = ""

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "$HERDR_BIN_PATH workspace create --cwd \"$HOME\" --focus"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "tab_id=$($HERDR_BIN_PATH tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs | sort_by(.number) | .[0].tab_id // empty'); [ -z \"$tab_id\" ] || $HERDR_BIN_PATH tab focus \"$tab_id\""

[[keys.command]]
key = "prefix+["
type = "shell"
command = "tab_id=$($HERDR_BIN_PATH tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs | sort_by(.number) | .[1].tab_id // empty'); [ -z \"$tab_id\" ] || $HERDR_BIN_PATH tab focus \"$tab_id\""

[[keys.command]]
key = "prefix+shift+["
type = "shell"
command = "tab_id=$($HERDR_BIN_PATH tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs | sort_by(.number) | .[2].tab_id // empty'); [ -z \"$tab_id\" ] || $HERDR_BIN_PATH tab focus \"$tab_id\""

[[keys.command]]
key = "prefix+shift+9"
type = "shell"
command = "tab_id=$($HERDR_BIN_PATH tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs | sort_by(.number) | .[3].tab_id // empty'); [ -z \"$tab_id\" ] || $HERDR_BIN_PATH tab focus \"$tab_id\""

[[keys.command]]
key = "prefix+shift+comma"
type = "shell"
command = "tab_id=$($HERDR_BIN_PATH tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID | jq -r '.result.tabs | sort_by(.number) | .[4].tab_id // empty'); [ -z \"$tab_id\" ] || $HERDR_BIN_PATH tab focus \"$tab_id\""

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "dev.feature-queue.run"
description = "run feature queue"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
prompt_new_tab_name = false
agent_panel_sort = "spaces"

status_indicators = "symbols"
[ui.toast]
delivery = "off"
